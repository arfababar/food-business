<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#f5f5f4"/>
  <g transform="translate(100, 100)" fill="none" stroke="#a8a29e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Burger Top Bun -->
    <path d="M 10 90 A 90 90 0 0 1 190 90 Z" fill="#e7e5e4"/>
    <!-- Patty / Filling -->
    <line x1="15" y1="110" x2="185" y2="110" stroke-width="12" stroke="#78716c"/>
    <!-- Cheese / Lettuce Wave -->
    <path d="M 10 130 Q 30 145 50 130 T 90 130 T 130 130 T 170 130 T 190 130" stroke="#d97706" stroke-width="8"/>
    <!-- Bottom Bun -->
    <rect x="20" y="150" width="160" height="30" rx="12" fill="#e7e5e4"/>
  </g>
  <text x="200" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#78716c" text-anchor="middle" letter-spacing="1">
    CRUNCH BOX
  </text>
  <text x="200" y="355" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#a8a29e" text-anchor="middle">
    Photo Placeholder
  </text>
</svg>
